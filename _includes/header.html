<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">
      <span class="site-header__mark" aria-hidden="true">LMLS</span>
      <span class="site-header__name">{{ site.title }}</span>
    </a>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
      <span class="sr-only">Menu</span>
    </button>

    <nav class="site-nav" id="site-nav">
      <ul>
        {% assign current = page.url | remove: 'index.html' %}
        {% for link in site.nav_links %}
          {% assign link_url = link.url | relative_url %}
          <li>
            <a href="{{ link_url }}"{% if page.url == link.url or current == link.url %} class="is-active" aria-current="page"{% endif %}>{{ link.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
